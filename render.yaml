services:
  - type: web
    name: amelia-birthday-api
    runtime: python
    region: oregon
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    preDeployCommand: alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --ws-max-size 8192
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CHAT_SESSION_SECRET
        generateValue: true
      - key: ADMIN_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: LOG_LEVEL
        value: INFO
